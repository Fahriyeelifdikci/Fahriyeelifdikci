    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="877" cy="229" r="2" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="229;211;229" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="788" cy="156" r="2.5" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="156;138;156" dur="6.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.9s" repeatCount="indefinite"/>
  </circle>
  </g>

  <!-- selamlama -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="1.2s" fill="freeze"/>
    <text x="58" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Merhaba, ben Fahriye<tspan fill="#E63946">.</tspan></text>
  </g>
  <text x="690" y="110" font-size="46">👋
    <animateTransform attributeName="transform" type="rotate" values="0 712 95;16 712 95;-6 712 95;16 712 95;0 712 95;0 712 95" keyTimes="0;0.1;0.2;0.3;0.4;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- kirmizi cizgi -->
  <rect x="60" y="134" width="120" height="4" rx="2" fill="#E63946">
    <animate attributeName="width" values="0;120" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- donen cumleler -->
  <text x="60" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E6EDF3" opacity="1">Backend geliştirici · ASP.NET Core
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.293;0.333;0.960;1" dur="10.5s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E6EDF3" opacity="0">Yapay zekâ ve görüntü işleme öğrencisi
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.373;0.627;0.667;1" dur="10.5s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E6EDF3" opacity="0">İşaret dilini metne çeviren bir sistem geliştiriyorum
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.707;0.960;1.000;1" dur="10.5s" repeatCount="indefinite"/>
  </text>

  <text x="60" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Bilgisayar Mühendisliği <tspan fill="#E63946">·</tspan> Balıkesir Üniversitesi</text>
</svg>
