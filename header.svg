    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="677" cy="173" r="2" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="173;155;173" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="847" cy="78" r="2.5" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="78;60;78" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="552" cy="174" r="1.5" fill="#FFFFFF" opacity="0.35">
