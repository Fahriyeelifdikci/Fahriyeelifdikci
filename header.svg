<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="270" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="270" fill="url(#bg)"/>
    <circle cx="760" cy="230" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="760;640;760" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;160;230" dur="12s" repeatCount="indefinite"/>
    </circle>
  <circle cx="685" cy="68" r="3" fill="#E63946" opacity="0.35">
    <animate attributeName="cy" values="68;50;68" dur="6.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="794" cy="54" r="2.5" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="54;36;54" dur="6.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="629" cy="39" r="1.5" fill="#E63946" opacity="0.35">
