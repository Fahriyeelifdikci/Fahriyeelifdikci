  </circle>
  <circle cx="583" cy="87" r="1.5" fill="#FFFFFF" opacity="0.35">
    <animate attributeName="cy" values="87;69;87" dur="6.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="545" cy="86" r="1.5" fill="#E63946" opacity="0.35">
    <animate attributeName="cy" values="86;68;86" dur="6.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.2s" repeatCount="indefinite"/>
