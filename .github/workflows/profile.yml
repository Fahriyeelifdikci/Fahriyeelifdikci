name: Profil Animasyonlari

on:
  schedule:
    - cron: "0 0 * * *"   # her gun gece yarisi (UTC) yeniler
  workflow_dispatch:       # Actions sekmesinden elle calistirmak icin
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Yilan SVG'lerini uret
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=E63946&color_dots=#ebedf0,#ffc9cc,#ff8a92,#e63946,#a4161a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=E63946&color_dots=#161b22,#4a1c20,#7d1f26,#c1272d,#e63946

      - name: output branch'ine gonder
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Istatistik kartlarini uret
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
